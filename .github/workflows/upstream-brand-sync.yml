name: "Upstream Brand Sync — Auto NasWebUI"

# Fetches new commits from the upstream nesquena/hermes-webui repo,
# applies the full NasWebUI branding transform (scripts/brand_upstream.sh),
# and opens a pull request so every change is reviewed before merging.
#
# Nothing from upstream ever reaches main without:
#   1. The brand transform running first (all Hermes → NasWebUI)
#   2. A PR being opened for human review
#   3. The normal test / lint CI passing on that PR
#
# Triggers:
#   - Schedule: daily at 06:00 UTC (catches upstream releases overnight)
#   - workflow_dispatch: run manually any time with optional upstream ref
#
# Required secret: GH_TOKEN  (PAT with repo + workflow scope,
#   needed to push the sync branch and open the PR)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to sync (branch, tag, or SHA)"
        required: false
        default: "master"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: "Fetch upstream → brand → open PR"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UPSTREAM_REPO: "https://github.com/nesquena/hermes-webui.git"
      UPSTREAM_REF:  ${{ github.event.inputs.upstream_ref || 'master' }}
      SYNC_BRANCH:   "upstream-brand-sync"
      GH_TOKEN:      ${{ secrets.GH_TOKEN || github.token }}

    steps:
      - name: Checkout NasWebUI (main)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "NasTech Brand Bot"
          git config user.email "brand-bot@nastech.ai"

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_REF" --no-tags
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Check if upstream has new commits
        id: diff_check
        run: |
          # Compare upstream FETCH_HEAD against our main
          BEHIND=$(git rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo "0")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commit(s) ahead of our main."

      - name: Skip if already up-to-date
        if: steps.diff_check.outputs.behind == '0'
        run: |
          echo "✅ Already up-to-date with upstream. Nothing to sync."
          exit 0

      - name: Create / reset sync branch
        if: steps.diff_check.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH" FETCH_HEAD

      - name: Apply NasWebUI branding transform
        if: steps.diff_check.outputs.behind != '0'
        run: |
          chmod +x scripts/brand_upstream.sh
          bash scripts/brand_upstream.sh .

      - name: Commit branded changes
        if: steps.diff_check.outputs.behind != '0'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after branding — upstream diff was brand-only noise."
            exit 0
          fi
          SHORT_SHA="${UPSTREAM_SHA:0:8}"
          git commit -m "chore: sync upstream ${SHORT_SHA} → NasWebUI brand applied

Fetched from: $UPSTREAM_REPO @ $UPSTREAM_REF ($SHORT_SHA)
Brand transform: scripts/brand_upstream.sh

All Hermes/hermes/HERMES references replaced with NasWebUI/naswebui/NASWEBUI.
Review diff carefully before merging — upstream logic changes may need
additional NasTech-specific adaptation.

Auto-generated by .github/workflows/upstream-brand-sync.yml"

      - name: Push sync branch
        if: steps.diff_check.outputs.behind != '0'
        run: |
          git push origin "$SYNC_BRANCH" --force

      - name: Open or update Pull Request
        if: steps.diff_check.outputs.behind != '0'
        env:
          SHORT_SHA: ${{ env.UPSTREAM_SHA }}
        run: |
          SHORT="${UPSTREAM_SHA:0:8}"
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING already open — updated by force-push."
          else
            gh pr create \
              --head "$SYNC_BRANCH" \
              --base main \
              --title "chore: upstream sync ${SHORT} → NasWebUI branding applied" \
              --body "$(cat <<'BODY'
## Upstream Sync — Auto NasWebUI Branding

This PR was auto-generated by the **Upstream Brand Sync** workflow.

### What happened
1. Fetched new commits from [nesquena/hermes-webui](https://github.com/nesquena/hermes-webui) upstream.
2. Applied the full NasWebUI branding transform via \`scripts/brand_upstream.sh\`.
3. All \`Hermes\`/\`hermes\`/\`HERMES\` references replaced with \`NasWebUI\`/\`naswebui\`/\`NASWEBUI\`.

### Before merging
- [ ] Review the diff for upstream logic changes that need NasTech-specific adaptation
- [ ] Confirm CI (tests + lint + browser smoke) is green on this PR
- [ ] Check that no new Hermes/hermes references slipped through

### Branding script
\`scripts/brand_upstream.sh\` — run it again any time to re-apply transforms.
BODY
)"
            echo "✅ PR created."
          fi

  # ── Safety net: scan merged main for any missed Hermes references ─────────
  brand-audit:
    name: "Brand audit — no Hermes references on main"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Scan for unbranded Hermes references
        run: |
          set +e
          HITS=$(grep -ril "hermes" \
            --include="*.py" --include="*.sh" --include="*.md" \
            --include="*.js" --include="*.html" --include="*.yml" \
            --include="*.yaml" --include="*.txt" --include="*.toml" \
            . 2>/dev/null | grep -v "^./.git/" | grep -v "^./docs/pr-media/")
          if [[ -n "$HITS" ]]; then
            echo "❌ Unbranded Hermes references found in:"
            echo "$HITS"
            echo ""
            echo "Run: bash scripts/brand_upstream.sh . — then commit & push."
            exit 1
          fi
          echo "✅ No unbranded Hermes references found."
